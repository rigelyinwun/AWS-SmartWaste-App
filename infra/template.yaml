AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SmartWaste - AI-powered waste analysis application

Parameters:
  DeployTimestamp:
    Type: String
    Default: "0"

Globals:
  Function:
    Timeout: 60
    MemorySize: 256
    Runtime: python3.12

Resources:
  # Amazon Location map tiles are rendered client-side via MapLibre using a
  # browser API key created manually in the console (Maps GetTile only).
  # Server-side geocoding / place search uses the Lambda role below (geo-places).

  # IAM Role for all Lambda functions
  AppBedrockRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "smartwaste-bedrock-role-${AWS::StackName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockInvokePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/global.anthropic.claude-haiku-4-5*"
                  - "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5*"
                  - "arn:aws:bedrock:*::foundation-model/anthropic.claude*"
        - PolicyName: GeoPlacesPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - geo-places:SearchText
                  - geo-places:Geocode
                  - geo-places:GetPlace
                Resource: "*"

  # Waste Details Lambda
  WasteDetailsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/waste_details/
      Handler: run.sh
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27"
      Role: !GetAtt AppBedrockRole.Arn
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_INVOKE_MODE: response_stream
          PORT: "8080"
          DEPLOY_TS: !Ref DeployTimestamp
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  # Further Actions Lambda
  FurtherActionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/further_actions/
      Handler: run.sh
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27"
      Role: !GetAtt AppBedrockRole.Arn
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_INVOKE_MODE: response_stream
          PORT: "8080"
          DEPLOY_TS: !Ref DeployTimestamp
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  # Environmental Impact Lambda
  EnvironmentalImpactFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/environmental_impact/
      Handler: run.sh
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27"
      Role: !GetAtt AppBedrockRole.Arn
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_INVOKE_MODE: response_stream
          PORT: "8080"
          DEPLOY_TS: !Ref DeployTimestamp
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  # SmartWaste Assistant Lambda
  SmartWasteAssistantFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/smartwaste_assistant/
      Handler: run.sh
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27"
      Role: !GetAtt AppBedrockRole.Arn
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_INVOKE_MODE: response_stream
          PORT: "8080"
          DEPLOY_TS: !Ref DeployTimestamp
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  # Nearby Facilities Lambda (returns JSON, not streamed)
  NearbyFacilitiesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/nearby_facilities/
      Handler: run.sh
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27"
      Role: !GetAtt AppBedrockRole.Arn
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          PORT: "8080"
          DEPLOY_TS: !Ref DeployTimestamp
      FunctionUrlConfig:
        AuthType: NONE

  # S3 Bucket for Frontend
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"

Outputs:
  WasteDetailsUrl:
    Value: !GetAtt WasteDetailsFunctionUrl.FunctionUrl
  FurtherActionsUrl:
    Value: !GetAtt FurtherActionsFunctionUrl.FunctionUrl
  EnvironmentalImpactUrl:
    Value: !GetAtt EnvironmentalImpactFunctionUrl.FunctionUrl
  SmartWasteAssistantUrl:
    Value: !GetAtt SmartWasteAssistantFunctionUrl.FunctionUrl
  NearbyFacilitiesUrl:
    Value: !GetAtt NearbyFacilitiesFunctionUrl.FunctionUrl
  AwsRegion:
    Value: !Ref AWS::Region
  WebsiteUrl:
    Value: !GetAtt FrontendBucket.WebsiteURL
  BucketName:
    Value: !Ref FrontendBucket

name: Deploy SmartWaste

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: SAM Build
        run: |
          chmod +x lambdas/*/run.sh
          sam build --template infra/template.yaml

      - name: SAM Deploy
        run: |
          sam deploy \
            --stack-name smartwaste \
            --s3-bucket ${{ secrets.SAM_DEPLOY_BUCKET }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ap-southeast-1 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --force-upload \
            --parameter-overrides \
              DeployTimestamp=$(date +%s) \
              VapidPublicKey='${{ secrets.VAPID_PUBLIC_KEY }}' \
              VapidPrivateKey='${{ secrets.VAPID_PRIVATE_KEY }}' \
              VapidSubject='${{ secrets.VAPID_SUBJECT }}'

      - name: Get Stack Outputs and Inject URLs
        run: |
          get_output() {
            aws cloudformation describe-stacks --stack-name smartwaste \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }

          # Configure CORS on each Function URL
          for func in WasteDetailsFunction FurtherActionsFunction EnvironmentalImpactFunction SmartWasteAssistantFunction NearbyFacilitiesFunction ProfileFunction CollectFunction; do
            FUNC_NAME=$(aws cloudformation describe-stack-resource --stack-name smartwaste \
              --logical-resource-id $func --query "StackResourceDetail.PhysicalResourceId" --output text)
            echo "Configuring CORS for $func ($FUNC_NAME)"
            aws lambda update-function-url-config \
              --function-name "$FUNC_NAME" \
              --auth-type NONE \
              --cors '{"AllowOrigins":["*"],"AllowMethods":["*"],"AllowHeaders":["*"]}' || true
          done

          URL=$(get_output WasteDetailsUrl)
          echo "WasteDetailsUrl = $URL"
          if [ -z "$URL" ] || [ "$URL" = "None" ]; then echo "ERROR: WasteDetailsUrl is empty"; exit 1; fi
          sed -i "s|__URL_WASTE_DETAILS__|$URL|g" frontend/index.html

          URL=$(get_output FurtherActionsUrl)
          echo "FurtherActionsUrl = $URL"
          if [ -z "$URL" ] || [ "$URL" = "None" ]; then echo "ERROR: FurtherActionsUrl is empty"; exit 1; fi
          sed -i "s|__URL_FURTHER_ACTIONS__|$URL|g" frontend/index.html

          URL=$(get_output EnvironmentalImpactUrl)
          echo "EnvironmentalImpactUrl = $URL"
          if [ -z "$URL" ] || [ "$URL" = "None" ]; then echo "ERROR: EnvironmentalImpactUrl is empty"; exit 1; fi
          sed -i "s|__URL_ENVIRONMENTAL_IMPACT__|$URL|g" frontend/index.html

          URL=$(get_output SmartWasteAssistantUrl)
          echo "SmartWasteAssistantUrl = $URL"
          if [ -z "$URL" ] || [ "$URL" = "None" ]; then echo "ERROR: SmartWasteAssistantUrl is empty"; exit 1; fi
          sed -i "s|__URL_SMARTWASTE_ASSISTANT__|$URL|g" frontend/index.html

          URL=$(get_output NearbyFacilitiesUrl)
          echo "NearbyFacilitiesUrl = $URL"
          if [ -z "$URL" ] || [ "$URL" = "None" ]; then echo "ERROR: NearbyFacilitiesUrl is empty"; exit 1; fi
          sed -i "s|__URL_NEARBY_FACILITIES__|$URL|g" frontend/index.html

          # Browser map API key is created manually in the console and stored
          # as a GitHub secret (MAP_API_KEY). Tiles only — Places uses the Lambda role.
          MAP_KEY='${{ secrets.MAP_API_KEY }}'
          echo "MapApiKey retrieved (length ${#MAP_KEY})"
          if [ -z "$MAP_KEY" ]; then echo "ERROR: MAP_API_KEY secret is empty"; exit 1; fi
          # Use a different sed delimiter since API keys may contain slashes
          sed -i "s#__MAP_API_KEY__#$MAP_KEY#g" frontend/index.html

          REGION_OUT=$(get_output AwsRegion)
          echo "AwsRegion = $REGION_OUT"
          if [ -z "$REGION_OUT" ] || [ "$REGION_OUT" = "None" ]; then echo "ERROR: AwsRegion is empty"; exit 1; fi
          sed -i "s|__AWS_REGION__|$REGION_OUT|g" frontend/index.html

          POOL_ID=$(get_output CognitoUserPoolId)
          echo "CognitoUserPoolId = $POOL_ID"
          if [ -z "$POOL_ID" ] || [ "$POOL_ID" = "None" ]; then echo "ERROR: CognitoUserPoolId is empty"; exit 1; fi
          sed -i "s|__COGNITO_POOL_ID__|$POOL_ID|g" frontend/index.html

          CLIENT_ID=$(get_output CognitoClientId)
          echo "CognitoClientId = $CLIENT_ID"
          if [ -z "$CLIENT_ID" ] || [ "$CLIENT_ID" = "None" ]; then echo "ERROR: CognitoClientId is empty"; exit 1; fi
          sed -i "s|__COGNITO_CLIENT_ID__|$CLIENT_ID|g" frontend/index.html

          # VAPID public key for Web Push (browser subscribe). Safe to expose.
          VAPID_PUB='${{ secrets.VAPID_PUBLIC_KEY }}'
          echo "VapidPublicKey length ${#VAPID_PUB}"
          sed -i "s#__VAPID_PUBLIC_KEY__#$VAPID_PUB#g" frontend/index.html

          URL=$(get_output ProfileUrl)
          echo "ProfileUrl = $URL"
          if [ -z "$URL" ] || [ "$URL" = "None" ]; then echo "ERROR: ProfileUrl is empty"; exit 1; fi
          sed -i "s|__URL_PROFILE__|$URL|g" frontend/index.html

          URL=$(get_output CollectUrl)
          echo "CollectUrl = $URL"
          if [ -z "$URL" ] || [ "$URL" = "None" ]; then echo "ERROR: CollectUrl is empty"; exit 1; fi
          sed -i "s|__URL_COLLECT__|$URL|g" frontend/index.html

          AS_HTTP=$(get_output AppSyncHttpDns)
          echo "AppSyncHttpDns = $AS_HTTP"
          sed -i "s|__APPSYNC_HTTP__|$AS_HTTP|g" frontend/index.html

          AS_RT=$(get_output AppSyncRealtimeDns)
          echo "AppSyncRealtimeDns = $AS_RT"
          sed -i "s|__APPSYNC_REALTIME__|$AS_RT|g" frontend/index.html

          AS_KEY=$(get_output AppSyncApiKey)
          echo "AppSyncApiKey retrieved (length ${#AS_KEY})"
          sed -i "s#__APPSYNC_API_KEY__#$AS_KEY#g" frontend/index.html

          echo "--- Verifying replacements ---"
          grep "STREAM_URLS" frontend/index.html

      - name: Deploy Frontend to S3
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name smartwaste \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
          aws s3 sync frontend/ s3://$BUCKET/ --cache-control no-cache

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id E2IBHD1PK4Z4GV --paths "/*" || echo "CloudFront invalidation skipped (no permission)"

      - name: Print Website URL
        run: |
          echo "CloudFront: https://d3f173je1qvblr.cloudfront.net"
          aws cloudformation describe-stacks --stack-name smartwaste \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteUrl'].OutputValue" --output text

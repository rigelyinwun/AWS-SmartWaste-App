name: Deploy SmartWaste

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: SAM Build
        run: sam build --template infra/template.yaml

      - name: SAM Deploy
        run: |
          sam deploy \
            --stack-name smartwaste \
            --s3-bucket ${{ secrets.SAM_DEPLOY_BUCKET }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ap-southeast-1 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Get Stack Outputs and Inject URLs
        run: |
          get_output() {
            aws cloudformation describe-stacks --stack-name smartwaste \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }

          URL=$(get_output WasteDetailsUrl)
          sed -i "s|__URL_WASTE_DETAILS__|$URL|g" frontend/index.html

          URL=$(get_output FurtherActionsUrl)
          sed -i "s|__URL_FURTHER_ACTIONS__|$URL|g" frontend/index.html

          URL=$(get_output EnvironmentalImpactUrl)
          sed -i "s|__URL_ENVIRONMENTAL_IMPACT__|$URL|g" frontend/index.html

          URL=$(get_output SmartWasteAssistantUrl)
          sed -i "s|__URL_SMARTWASTE_ASSISTANT__|$URL|g" frontend/index.html

      - name: Deploy Frontend to S3
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name smartwaste \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
          aws s3 sync frontend/ s3://$BUCKET/ --cache-control no-cache

      - name: Print Website URL
        run: |
          aws cloudformation describe-stacks --stack-name smartwaste \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteUrl'].OutputValue" --output text
